function buildQuads(f,y0,y1){
  const pos=[],nor=[];
  for(let i=0;i<f.length;i+=4){
    const x1=f[i],z1=-f[i+1],x2=f[i+2],z2=-f[i+3];
    let nx=-(z2-z1),nz=(x2-x1); const l=Math.hypot(nx,nz)||1; nx/=l; nz/=l;
    const P=[[x1,y0,z1],[x2,y0,z2],[x2,y1,z2],[x1,y1,z1]];
    for(const k of [0,1,2,0,2,3]){ pos.push(...P[k]); nor.push(nx,0,nz);}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  return g;
}

function label(t){
  const c=document.createElement('canvas'),x=c.getContext('2d'),fs=52;
  x.font='bold '+fs+'px Arial'; c.width=x.measureText(t).width+44; c.height=fs+28;
  x.font='bold '+fs+'px Arial'; x.fillStyle='rgba(25,35,55,0.8)';

const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05);
  let sp=22*dt; if(keys['ShiftLeft']||keys['ShiftRight'])sp*=2.5;
